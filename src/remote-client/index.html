<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the safe-area env() insets in styles.css work
         on notched phones; maximum-scale=1 stops iOS zooming the composer.
         interactive-widget=resizes-content asks Android Chrome to shrink the
         layout viewport for the on-screen keyboard instead of scrolling the
         page over it — iOS Safari ignores it but Scaffold.tsx covers iOS via
         visualViewport, so both platforms end up with the composer visible
         while typing. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#101014" />
    <title>Agent Code Remote</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
