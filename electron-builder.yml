appId: com.agentcode.app
productName: Agent Code
copyright: "Copyright © 2026 Julius Olsson"
artifactName: "${productName}-${version}-${arch}.${ext}"
directories:
  output: release
afterPack: scripts/after-pack.mjs
asar: true
asarUnpack:
  - out/main/mitmAddon.py
  # Bundled third-party runtime tools (mitmproxy, tmux, ...). Each is
  # spawned as a real executable / extracted from a real tar.gz, so
  # the whole tree must live on the filesystem rather than inside the
  # asar virtual FS. See third_party/<tool>/README.md and issue #119.
  - out/main/runtime/**/*
  # Native Node modules (node-pty's pty.node is the one that matters —
  # it is the PTY layer for EVERY terminal). electron-builder's implicit
  # native-module detection is a documented footgun once a custom
  # asarUnpack list exists: if detection misses, the packaged app can't
  # dlopen the module and every terminal is dead — invisible in
  # `npm run dev`, fatal in the dmg (#495 A3). Explicit beats implicit.
  - "**/*.node"
files:
  - out/**
  - package.json
  - node_modules/**
  # Agent Code resolves and validates one Codex CLI during setup and passes
  # that absolute path to the SDK. Shipping the SDK's optional per-platform
  # CLI packages would add hundreds of megabytes and create a second binary
  # source of truth that setup never verified.
  - "!node_modules/@openai/codex-darwin-*/**"
  - "!node_modules/@openai/codex-linux-*/**"
  - "!node_modules/@openai/codex-win32-*/**"
  - "!node_modules/.cache/**"
  - "!vendor/**"
  - "!testing/**"
  - "!docs/**"
  - "!scripts/**"
  - "!src/**"
  - "!**/*.map"
  - "!**/test/**"
  - "!**/tests/**"
  # node-pty's install step has already produced the one target-architecture
  # build/Release/pty.node that Electron loads. Its npm tarball also carries
  # Windows DLLs and both Darwin prebuilds; shipping those dead binaries adds
  # tens of megabytes, enlarges the notarization scan surface, and makes a
  # structural architecture audit report false failures.
  - "!node_modules/node-pty/prebuilds/**"
  - "!.proxy-testing/**"
  - "!.tsc-out/**"
extraResources:
  # WHY licenses live outside app.asar: these notices describe executables we
  # redistribute, not implementation resources. Keeping them as ordinary files
  # under Contents/Resources/licenses makes them inspectable even if the app
  # cannot launch, and prevents the broad `!third_party/**` production-source
  # exclusion above from silently dropping our attribution obligations.
  - from: LICENSE
    to: licenses/Agent-Code-LICENSE.txt
  - from: third_party/mitmproxy/LICENSE.md
    to: licenses/mitmproxy-LICENSE.md
  - from: third_party/tmux/LICENSE.md
    to: licenses/tmux-LICENSE.md
  - from: third_party/cloudflared/LICENSE.md
    to: licenses/cloudflared-LICENSE.md
  - from: PRIVACY.md
    to: PRIVACY.md
extraMetadata:
  main: out/main/index.js
mac:
  category: public.app-category.developer-tools
  # Committed .icns (#495 A18): without an explicit icon, electron-builder
  # regenerates one from build/icon.png at pack time via sips/iconutil —
  # fine on a provisioned Mac, non-deterministic and host-dependent
  # everywhere else. The committed artifact makes the icon reproducible.
  icon: build/icon.icns
  # Electron 38+ follows Chromium in requiring Monterey. Stating the floor in
  # the bundle prevents an older Mac from downloading a build that the embedded
  # Chromium cannot start, and keeps the Swift helper's deployment target in
  # lockstep with the actual application runtime.
  minimumSystemVersion: "12.0"
  extendInfo:
    NSMicrophoneUsageDescription: "Agent Code uses the microphone only when you start voice dictation. Audio is sent to your configured transcription provider."
    NSLocalNetworkUsageDescription: "Agent Code can expose an optional, authenticated remote companion to devices on your local network."
  # WHY an explicit arch list (#495 A2): electron-builder defaults to the
  # HOST arch, so CI on an arm64 runner shipped arm64-only artifacts and
  # an Intel Mac had nothing to run. Two thin per-arch artifacts beat one
  # universal: lipo-merging has historically choked on asymmetric native
  # deps (node-pty), thin dmgs are half the download, and artifactName
  # already templates ${arch} so names don't collide. Native deps are
  # rebuilt per target arch by electron-builder's default npmRebuild —
  # do NOT set npmRebuild:false or the x64 dmg ships the dev machine's
  # arm64 pty.node and crashes on launch (#495 A3).
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  artifactName: "${productName}-${version}-${arch}.${ext}"
