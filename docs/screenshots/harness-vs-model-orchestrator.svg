<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Model orchestrator vs harness orchestrator</title>
  <desc id="d">Left: a model orchestrator such as OpenCode or Pi is one harness that reimplements prompts, tools and the agent loop, then points it at many models. Right: Agent Code is a harness orchestrator; it runs the real Claude Code, Codex, OpenCode, Pi and Grok harnesses, each driving its own models, and builds one workspace on top of all of them.</desc>
  <!-- WHY one SVG with a prefers-color-scheme block instead of a <picture>
       light/dark pair: GitHub serves README SVGs through <img>, where the
       embedded media query still follows the viewer's theme. One file means
       the two variants can never drift apart. Keep it text-light: the diagram
       has to read at README width on a phone. -->
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .box { fill: #ffffff; stroke: #8c959f; }
    .accent { fill: #ddf4ff; stroke: #0969da; }
    .model { fill: #ffffff; stroke: #d0d7de; }
    .h { fill: #1f2328; font-weight: 700; }
    .t { fill: #1f2328; }
    .m { fill: #59636e; }
    .a { fill: #0969da; font-weight: 700; }
    .line { stroke: #8c959f; fill: none; }
    .line-a { stroke: #0969da; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .box { fill: #0d1117; stroke: #6e7681; }
      .accent { fill: #0c2d4f; stroke: #4493f8; }
      .model { fill: #0d1117; stroke: #30363d; }
      .h, .t { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .a { fill: #4493f8; }
      .line { stroke: #6e7681; }
      .line-a { stroke: #4493f8; }
    }
  </style>

  <rect class="bg" width="880" height="400" rx="12"/>

  <!-- Left: model orchestrator -->
  <rect class="panel" x="16" y="16" width="416" height="368" rx="10"/>
  <text class="h" x="36" y="50" font-size="18">Model orchestrator</text>
  <text class="m" x="36" y="72" font-size="13">OpenCode, Pi — one harness, many models</text>

  <rect class="box" x="96" y="100" width="256" height="92" rx="8"/>
  <text class="t" x="224" y="130" font-size="15" font-weight="600" text-anchor="middle">One reimplemented harness</text>
  <text class="m" x="224" y="152" font-size="12.5" text-anchor="middle">its own prompts, tools, agent loop,</text>
  <text class="m" x="224" y="170" font-size="12.5" text-anchor="middle">compaction and per-model quirks</text>

  <path class="line" stroke-width="1.5" d="M224 192 V222 M68 222 H380 M68 222 V250 M172 222 V250 M276 222 V250 M380 222 V250"/>
  <g font-size="13" text-anchor="middle">
    <rect class="model" x="28" y="250" width="80" height="34" rx="6"/><text class="t" x="68" y="272">Claude</text>
    <rect class="model" x="132" y="250" width="80" height="34" rx="6"/><text class="t" x="172" y="272">GPT</text>
    <rect class="model" x="236" y="250" width="80" height="34" rx="6"/><text class="t" x="276" y="272">Gemini</text>
    <rect class="model" x="340" y="250" width="80" height="34" rx="6"/><text class="t" x="380" y="272">…</text>
  </g>
  <text class="m" x="224" y="330" font-size="13" text-anchor="middle">You swap the model.</text>
  <text class="m" x="224" y="350" font-size="13" text-anchor="middle">The harness is always the same one.</text>

  <!-- Right: harness orchestrator -->
  <rect class="panel" x="448" y="16" width="416" height="368" rx="10"/>
  <text class="h" x="468" y="50" font-size="18">Harness orchestrator</text>
  <text class="a" x="468" y="72" font-size="13">Agent Code — many harnesses, one IDE</text>

  <rect class="accent" x="468" y="100" width="376" height="92" rx="8" stroke-width="1.5"/>
  <text class="t" x="656" y="130" font-size="15" font-weight="600" text-anchor="middle">Agent Code</text>
  <text class="m" x="656" y="152" font-size="12.5" text-anchor="middle">tiling · switching · orchestration · Goal / TLDR</text>
  <text class="m" x="656" y="170" font-size="12.5" text-anchor="middle">everything you build on top</text>

  <path class="line-a" stroke-width="1.5" d="M656 192 V222 M500 222 H812 M500 222 V250 M578 222 V250 M656 222 V250 M734 222 V250 M812 222 V250"/>
  <g font-size="12" text-anchor="middle">
    <rect class="box" x="464" y="250" width="72" height="46" rx="6"/><text class="t" x="500" y="270">Claude</text><text class="t" x="500" y="286">Code</text>
    <rect class="box" x="542" y="250" width="72" height="46" rx="6"/><text class="t" x="578" y="278">Codex</text>
    <rect class="box" x="620" y="250" width="72" height="46" rx="6"/><text class="t" x="656" y="278">OpenCode</text>
    <rect class="box" x="698" y="250" width="72" height="46" rx="6"/><text class="t" x="734" y="278">Pi</text>
    <rect class="box" x="776" y="250" width="72" height="46" rx="6"/><text class="t" x="812" y="278">Grok</text>
  </g>
  <text class="m" x="656" y="316" font-size="11" text-anchor="middle">the real CLIs · their own prompts, tools and login</text>
  <text class="m" x="656" y="350" font-size="13" text-anchor="middle">You keep every harness exactly as its vendor ships it,</text>
  <text class="m" x="656" y="370" font-size="13" text-anchor="middle">and get one workspace on top of all of them.</text>
</svg>
