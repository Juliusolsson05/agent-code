name: Release macOS App

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release with the built artifacts"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      channel:
        description: "prerelease (a beta; never latest) or stable (becomes releases/latest). Must match package.json: stable needs a version without -beta etc."
        required: true
        default: "prerelease"
        type: choice
        options:
          - "prerelease"
          - "stable"
      # WHY these are optional and default to empty (Stage 8 of
      # docs/decomposition/release-readiness.md): they used to default to
      # v0.0.2-beta.1, the release that already exists, so every later
      # dispatch had to override both or fail. Empty now means "derived from
      # package.json" (scripts/release/identity.mjs), which is the only tag
      # the check accepts anyway.
      release_tag:
        description: "Release tag; empty = v<package.json version>"
        required: false
        default: ""
      release_name:
        description: "Release name; empty = Agent Code <version>"
        required: false
        default: ""

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    # The release identity, decided once before any build and handed to the
    # job that publishes (package-macos).
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      name: ${{ steps.identity.outputs.name }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
      make_latest: ${{ steps.identity.outputs.make_latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release secrets
        env:
          PUBLISH_RELEASE: ${{ github.event.inputs.publish_release }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$PUBLISH_RELEASE" != "true" ]; then
            exit 0
          fi

          missing=()
          [ -z "${CSC_LINK:-}" ] && missing+=(CSC_LINK)
          [ -z "${CSC_KEY_PASSWORD:-}" ] && missing+=(CSC_KEY_PASSWORD)
          [ -z "${APPLE_ID:-}" ] && missing+=(APPLE_ID)
          [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && missing+=(APPLE_APP_SPECIFIC_PASSWORD)
          [ -z "${APPLE_TEAM_ID:-}" ] && missing+=(APPLE_TEAM_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Cannot publish a macOS release without signing/notarization secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      # The rules (tag = v<version>; the stable channel needs a stable
      # version and the prerelease channel a prerelease one) live in a script
      # with system tests: testing/system/release/identity.test.ts.
      - name: Validate release identity
        id: identity
        if: ${{ github.event.inputs.publish_release == 'true' }}
        env:
          CHANNEL: ${{ github.event.inputs.channel }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          RELEASE_NAME: ${{ github.event.inputs.release_name }}
        run: node scripts/release/identity.mjs

  # DRIFT WARNING: build-app and package-macos below are mirrored verbatim in
  # .github/workflows/reusable-app-build-macos.yml, which the nightly
  # (nightly.yml, #1011) builds through. Until this file adopts that reusable
  # workflow (a follow-up once nightlies run green), a fix to either copy
  # MUST be mirrored in the other. The #965 executable-bit fix is the kind of
  # hotfix that would otherwise land here only and silently leave nightlies
  # shipping a broken build.
  build-app:
    needs: validate-release
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure submodule auth
        env:
          SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT }}
          SUBMODULE_SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}
        run: |
          if [ -n "$SUBMODULE_PAT" ]; then
            echo "::add-mask::$SUBMODULE_PAT"
            git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/Juliusolsson05/".insteadOf "https://github.com/Juliusolsson05/"
            git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/Juliusolsson05/".insteadOf "git@github-personal:Juliusolsson05/"
            exit 0
          fi

          # WHY no hard-fail when both secrets are absent: every submodule
          # repo (every Juliusolsson05 packages/* repo and openai/codex)
          # is PUBLIC, so the plain HTTPS URLs in .gitmodules clone fine
          # anonymously. The exit-1 here predated the repos going public and
          # contradicted README.md's "no special access needed" (#506
          # review). The PAT/SSH branches above are kept for private forks
          # of the submodules — configure either secret and it takes over.
          if [ -z "$SUBMODULE_SSH_KEY" ]; then
            echo "No SUBMODULE_PAT/SUBMODULE_SSH_KEY configured; submodule repos are public, using anonymous HTTPS."
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s' "$SUBMODULE_SSH_KEY" | perl -pe 's/\\n/\n/g' > ~/.ssh/submodule_key
          printf '\n' >> ~/.ssh/submodule_key
          chmod 600 ~/.ssh/submodule_key
          ssh-keygen -y -f ~/.ssh/submodule_key > /dev/null
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host github-personal
            HostName github.com
            User git
            IdentityFile ~/.ssh/submodule_key
            IdentitiesOnly yes
          EOF
          git config --global url."git@github-personal:Juliusolsson05/".insteadOf "https://github.com/Juliusolsson05/"

      - name: Checkout submodules
        # All submodules are public: anonymous HTTPS works with no secrets.
        # SUBMODULE_PAT / SUBMODULE_SSH_KEY (previous step) only rewrite the
        # URLs when configured, for private forks.
        run: git submodule update --init --recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Type-check main and renderer
        # electron-vite transpiles TypeScript but does not enforce the project references. This gate
        # caught a real recovery_required count initializer that produced NaN in the shipped UI.
        run: npm run typecheck

      - name: Test Workflow MCP
        run: npm --prefix packages/workflow-mcp test

      - name: Test Agent Code workflow integration
        run: |
          npm run test:unit
          npm run test:integration
          npm run test:renderer

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Prepare bundled runtime tools
        # WHY this belongs in build-app, not package-macos: `npm run build`
        # runs scripts/copy-packaged-resources.mjs in this job, and that copy
        # step reads third_party/<tool>/cache/ into `out/main/runtime`. The
        # package-macos job packages the uploaded `out` tree verbatim, so
        # preparing later would still ship manifest-only runtime folders.
        run: npm run runtime:prepare:mac

      - name: Build app
        run: npm run build

      - name: Archive app build
        # WHY a tar instead of uploading `out/` directly: upload-artifact zips its
        # input without file modes, so every file comes back 644 (its README,
        # "Permission Loss"). `out/` carries executables that must stay
        # executable inside the packaged app: the universal dictation hotkey
        # helper from scripts/build-hotkey-helper.mjs and the bundled tmux,
        # cloudflared and mitmproxy binaries under out/main/runtime. The
        # package-macos job packages the downloaded tree verbatim, so release run
        # 34739982565 shipped a non-executable helper and
        # scripts/verify-packaged-mac.mjs rejected it (#965). tar records modes
        # and symlinks, so the zip wrapped around the tar no longer matters.
        run: tar -cf app-build.tar out

      - name: Upload app build
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: app-build.tar
          if-no-files-found: error

  package-macos:
    # validate-release is listed so its identity outputs are in `needs` here;
    # build-app already waits for it.
    needs: [validate-release, build-app]
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      # GitHub intentionally disallows direct secrets.* reads in an `if:`
      # expression. Materialize only the boolean here; the certificate itself
      # remains available solely to the packaging step below.
      HAS_SIGNING_IDENTITY: ${{ secrets.CSC_LINK != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure submodule auth
        env:
          SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT }}
          SUBMODULE_SSH_KEY: ${{ secrets.SUBMODULE_SSH_KEY }}
        run: |
          if [ -n "$SUBMODULE_PAT" ]; then
            echo "::add-mask::$SUBMODULE_PAT"
            git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/Juliusolsson05/".insteadOf "https://github.com/Juliusolsson05/"
            git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/Juliusolsson05/".insteadOf "git@github-personal:Juliusolsson05/"
            exit 0
          fi

          # WHY no hard-fail when both secrets are absent: every submodule
          # repo (every Juliusolsson05 packages/* repo and openai/codex)
          # is PUBLIC, so the plain HTTPS URLs in .gitmodules clone fine
          # anonymously. The exit-1 here predated the repos going public and
          # contradicted README.md's "no special access needed" (#506
          # review). The PAT/SSH branches above are kept for private forks
          # of the submodules — configure either secret and it takes over.
          if [ -z "$SUBMODULE_SSH_KEY" ]; then
            echo "No SUBMODULE_PAT/SUBMODULE_SSH_KEY configured; submodule repos are public, using anonymous HTTPS."
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s' "$SUBMODULE_SSH_KEY" | perl -pe 's/\\n/\n/g' > ~/.ssh/submodule_key
          printf '\n' >> ~/.ssh/submodule_key
          chmod 600 ~/.ssh/submodule_key
          ssh-keygen -y -f ~/.ssh/submodule_key > /dev/null
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host github-personal
            HostName github.com
            User git
            IdentityFile ~/.ssh/submodule_key
            IdentitiesOnly yes
          EOF
          git config --global url."git@github-personal:Juliusolsson05/".insteadOf "https://github.com/Juliusolsson05/"

      - name: Checkout submodules
        # All submodules are public: anonymous HTTPS works with no secrets.
        # SUBMODULE_PAT / SUBMODULE_SSH_KEY (previous step) only rewrite the
        # URLs when configured, for private forks.
        run: git submodule update --init --recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache Electron packages
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Download app build
        uses: actions/download-artifact@v8
        with:
          name: app-build

      - name: Unpack app build
        # Restores `out/` with the file modes recorded in build-app; see
        # "Archive app build" there for why the tree travels as a tar.
        run: tar -xf app-build.tar && rm app-build.tar

      - name: Package macOS artifacts
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The unsigned-fallback policy (no CSC_LINK/CSC_NAME → disable
        # identity auto-discovery, strip APPLE_* notarization vars) lives
        # in scripts/package-mac.mjs so local dev builds and CI share ONE
        # implementation (#495 A6). This step used to carry its own inline
        # copy of that logic, which is exactly how it drifted out of the
        # npm scripts in the first place.
        run: npm run package:mac

      - name: Verify packaged app contents and architectures
        # verify-update-feed (#1129): every file latest-mac.yml names must exist
        # here under exactly that name, or installed apps get 404 when they
        # update. Checked before upload, while the feed and files sit together.
        run: |
          npm run verify:package:mac
          npm run smoke:package:mac
          node scripts/release/verify-update-feed.mjs

      - name: Verify signed apps and notarization tickets
        if: ${{ env.HAS_SIGNING_IDENTITY == 'true' }}
        run: |
          found_app=0
          while IFS= read -r -d '' app_path; do
            found_app=1
            codesign --verify --deep --strict --verbose=2 "$app_path"
            spctl --assess --type execute --verbose=2 "$app_path"
            xcrun stapler validate "$app_path"
          done < <(find release -type d -name 'Agent Code.app' -print0)
          if [ "$found_app" -ne 1 ]; then
            echo 'No packaged Agent Code.app bundles found for signature verification'
            exit 1
          fi

          found_dmg=0
          while IFS= read -r -d '' dmg_path; do
            found_dmg=1
            hdiutil verify "$dmg_path"
          done < <(find release -maxdepth 1 -type f -name '*.dmg' -print0)
          if [ "$found_dmg" -ne 1 ]; then
            echo 'No DMGs found for notarization-ticket validation'
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          # WHY the conditional name: without CSC_LINK the packaging step
          # builds UNSIGNED dev artifacts (scripts/package-mac.mjs fallback),
          # and an unsigned build parked under a name like "macos-release"
          # is exactly the artifact someone grabs and ships by mistake. The
          # artifact name tracks what the build actually IS (signed vs not),
          # not what the run intended: publish_release=true already
          # guarantees CSC_LINK via the validate-release job, so every
          # published artifact is named macos-release, and everything
          # unsigned is unmistakably macos-unsigned-dev.
          name: ${{ env.HAS_SIGNING_IDENTITY == 'true' && 'macos-release' || 'macos-unsigned-dev' }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ needs.validate-release.outputs.tag }}
          # The tag must name the commit that was BUILT (#1035 review). A
          # stable release is created as a draft and published after the
          # uploads, and GitHub creates the tag only then. Without this it tags
          # the default branch's head at that moment, which can be a commit
          # merged during the ~26-minute build, or main when the release was
          # dispatched from another ref.
          target_commitish: ${{ github.sha }}
          name: ${{ needs.validate-release.outputs.name }}
          # Hardcoded `true` until Stage 8, so no stable release could be
          # made and releases/latest 404'd. make_latest is explicit either
          # way: a beta must never become the fallback latest.
          prerelease: ${{ needs.validate-release.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.validate-release.outputs.make_latest }}
          # latest-mac.yml by name, not release/*.yml: the wildcard also
          # published electron-builder's builder-debug.yml on every release.
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
