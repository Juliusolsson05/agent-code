name: Preview release

# A signed preview of the NEXT version, built from `main` every night
# (RELEASE.md, "Channels"). The logic lives in scripts/release/preview.mjs,
# tested in testing/system/release/preview.test.ts; the load-bearing
# decisions:
#
#   - Version: the next PATCH of package.json plus the UTC date, for example
#     `0.1.4-preview.20260924` after stable 0.1.3. It is stamped into the app,
#     so a preview reports what it is. Manual runs can target the next MINOR
#     and add the time, so they never collide with that night's tag.
#   - Two releases per run: a DATED prerelease (`v0.1.4-preview.20260924`),
#     and the ROLLING `preview` release with fixed asset names, the one link
#     that always downloads the newest preview. Both are prereleases with
#     make_latest=false: `releases/latest` is owned by manual stable releases
#     (release.yml), and it is what the landing page and the in-app updater
#     use. softprops sends make_latest on EVERY update, so an explicit `true`
#     here would take "latest" back from a stable release (PR #1012 review).
#   - The skip state is a `built-from: <sha>` marker in the ROLLING release's
#     body, written LAST — after both releases published — so a failed or
#     partial publish leaves no marker for that SHA and the next run rebuilds
#     instead of skipping over a broken preview (PR #1012 review). The skip
#     check also requires all four rolling assets to be uploaded.
#   - Old dated previews are pruned (14 days, newest 3 always kept) after a
#     successful publish, never before, so a failing build cannot leave
#     nothing to fall back to. The retired rolling-only `nightly` release,
#     which this workflow replaced, is deleted by the same step.
#   - Own concurrency group, NOT release.yml's `release-macos`: GitHub keeps
#     one pending run per group and a newer pending run CANCELS the older
#     pending one, so sharing the group let a scheduled run cancel a queued
#     stable release. They publish to different releases, so running side by
#     side is safe. An in-progress run is never cancelled (a 26-minute
#     notarizing run killed midway is wasted and leaves no evidence).

on:
  schedule:
    # 05:00 UTC daily. GitHub's scheduler starts this about 4.5 hours late on
    # most days (runs begin around 09:45 UTC); a late preview is fine, a
    # missing one is not — the skip check keeps it idempotent.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      target:
        # Scheduled runs always preview the next patch. Choose minor while
        # preparing a minor release, so its previews are labelled 0.2.0-preview.
        description: "Which version this previews: the next patch (0.1.3 → 0.1.4) or the next minor (0.1.3 → 0.2.0)"
        type: choice
        default: patch
        options:
          - patch
          - minor
      force:
        # Rebuild even when the dispatched SHA already has a complete
        # preview — the escape hatch for a release someone edited or
        # damaged by hand. Scheduled runs never force.
        description: "Rebuild and republish even if this commit already has a preview"
        type: boolean
        default: false

concurrency:
  group: release-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-preview-secrets:
    # The preview always publishes, so signing is mandatory — fail in
    # seconds, not after a 9-minute build. Same shape as release.yml's
    # validate-release step (deliberate mirror; see the drift warning in
    # reusable-app-build-macos.yml).
    runs-on: ubuntu-latest
    steps:
      - name: Validate signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          [ -z "${CSC_LINK:-}" ] && missing+=(CSC_LINK)
          [ -z "${CSC_KEY_PASSWORD:-}" ] && missing+=(CSC_KEY_PASSWORD)
          [ -z "${APPLE_ID:-}" ] && missing+=(APPLE_ID)
          [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && missing+=(APPLE_APP_SPECIFIC_PASSWORD)
          [ -z "${APPLE_TEAM_ID:-}" ] && missing+=(APPLE_TEAM_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'The preview always publishes a signed release; missing secrets: %s\n' "${missing[*]}"
            exit 1
          fi

  check-for-changes:
    needs: validate-preview-secrets
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
      head-sha: ${{ steps.decide.outputs.head-sha }}
      prev-sha: ${{ steps.decide.outputs.prev-sha }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - name: Checkout the release scripts and package.json
        # scripts/release uses Node built-ins alone (the runner's Node, no
        # npm ci). package.json is the stable version the preview follows.
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/release
            package.json
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Decide the preview version and whether to build
        id: decide
        # GITHUB_SHA, GITHUB_REPOSITORY, GITHUB_REF_NAME, GITHUB_EVENT_NAME and
        # GITHUB_OUTPUT are the runner's defaults. Scheduled runs build main's
        # HEAD. workflow_dispatch only runs a workflow file that exists on the
        # default branch, and builds the ref it names.
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          TARGET: ${{ github.event.inputs.target || 'patch' }}
        run: node scripts/release/preview.mjs decide

  build:
    needs: check-for-changes
    if: needs.check-for-changes.outputs.changed == 'true'
    # secrets: inherit is required — the packaging step reads the signing
    # secrets directly.
    uses: ./.github/workflows/reusable-app-build-macos.yml
    with:
      version: ${{ needs.check-for-changes.outputs.version }}
    secrets: inherit

  publish-preview:
    # Needs BOTH: `build` for ordering, `check-for-changes` for its outputs —
    # the `needs.<id>` context only contains direct dependencies.
    needs: [check-for-changes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HEAD_SHA: ${{ needs.check-for-changes.outputs.head-sha }}
      PREV_SHA: ${{ needs.check-for-changes.outputs.prev-sha }}
      VERSION: ${{ needs.check-for-changes.outputs.version }}
      TAG: ${{ needs.check-for-changes.outputs.tag }}
    steps:
      - name: Checkout full history
        # For the commit list in the release bodies.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-release
          # Defense in depth: if signing was somehow absent the reusable
          # workflow uploaded `macos-unsigned-dev` instead, and asking for
          # `macos-release` fails here rather than publishing unsigned bits.
          path: release

      - name: Add the fixed-name rolling copies
        # Exactly one dmg and one zip per architecture, or the run fails
        # naming what it found. Publishing the wrong binary under a permanent
        # URL is worse than a red run. Blockmaps and the update feed file are
        # dropped: previews are never offered by the updater.
        run: node scripts/release/preview.mjs rename release

      - name: Compose release bodies
        # If the previous SHA is not in this clone (force-pushed, deleted,
        # hand-edited), the notes fall back to recent history instead of
        # failing `git log` after a full build.
        run: node scripts/release/preview.mjs notes .

      - name: Publish the dated preview
        # Created fresh each run (a same-day rerun updates it), so the
        # Releases page lists every preview at its own date.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ env.HEAD_SHA }}
          name: Agent Code ${{ env.VERSION }}
          prerelease: true
          make_latest: false
          body_path: preview-dated-body.md
          files: |
            release/Agent-Code-*.dmg
            release/Agent-Code-*.zip

      - name: Publish the rolling preview
        # softprops updates the existing release when the tag already
        # exists, deleting and re-uploading each same-named asset
        # (overwrite_files defaults to true at this pinned v3.0.3) — that
        # replacement IS the rolling mechanism. ACCEPTED TRADE-OFF: each asset
        # is briefly missing between its delete and its re-upload, so a link
        # followed at that moment can 404 once.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: preview
          # Used only when the tag is first created: without it GitHub tags
          # the default branch HEAD at publish time, not the commit built.
          target_commitish: ${{ env.HEAD_SHA }}
          name: Agent Code Preview (newest)
          prerelease: true
          make_latest: false
          body_path: preview-body-publishing.md
          files: |
            release/Agent.Code-preview-arm64.dmg
            release/Agent.Code-preview-arm64.zip
            release/Agent.Code-preview-x64.dmg
            release/Agent.Code-preview-x64.zip

      - name: Record the built-from marker
        # Last of the publishing steps on purpose: the marker is the skip
        # check's proof that THIS SHA has a complete preview, so it is written
        # only after both releases published with every asset uploaded.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit preview --repo "${GITHUB_REPOSITORY}" --notes-file preview-body.md

      - name: Prune old previews
        # After a successful publish only. Deletes dated previews older than
        # 14 days (always keeping the newest 3) and the retired `nightly`
        # release, with their tags. Only exact `vX.Y.Z-preview.<date>` tags can
        # match, so a stable or hand-cut release can never be deleted here.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/preview.mjs prune
